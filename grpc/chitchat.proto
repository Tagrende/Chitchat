
syntax = "proto3";

package chitchat;

option go_package = "chitchat/grpc;grpc";

service ChitChat {
  rpc Connect(stream ClientRequest)
      returns (stream ServerEvent);
}

message ClientRequest {
  oneof request {
    JoinRequest join = 1;
    PublishRequest publish = 2;
    LeaveRequest leave = 3;
  }
}

message JoinRequest {
  string display_name = 1;
}

message PublishRequest {
  string content = 1;
}

message LeaveRequest {
}

message ServerEvent {
  oneof event {
    JoinConfirmation join_confirmation = 1;
    Broadcast broadcast = 2;
    ErrorResponse error = 3;
  }
}

message JoinConfirmation {
  string participant_id = 1;
  string display_name = 2;
}

message Broadcast {
  string content = 1;
  int64 logical_timestamp = 2;
  string participant_id = 3;
  string display_name = 4;
  EventType event_type = 5;
}

message ErrorResponse {
  string message = 1;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_JOIN = 1;
  EVENT_TYPE_CHAT = 2;
  EVENT_TYPE_LEAVE = 3;
}


// INFO:

// Connect	Opens a long-lived, two-way stream for each client.

// ClientRequest	Carries a join, publish, or leave action.

// oneof request	Prevents a single request from containing multiple actions simultaneously.

// oneof event    ensures each server event contains one of those three event types.

// ServerEvent	Represents a broadcast event sent from the server to clients.

// JoinConfirmation    tells a client its assigned ID, for example client-1.

// Broadcast           carries the message, the Lamport timestamp, and the participant's identity.

// ErrorResponse gives the server a way to report invalid requests, such as messages exceeding the 128-character limit.

// logical_timestamp	Carries the server-assigned Lamport timestamp.

// participant_id	Identifies the participant associated with the event.

// EventType	Distinguishes join, chat, and leave events.